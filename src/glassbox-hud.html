<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI Variable", "Segoe UI", -apple-system, "Microsoft YaHei", sans-serif; }
  body { display: flex; align-items: flex-end; justify-content: center; padding: 6px; }

  /* Fluent acrylic command panel: translucent, soft, thin highlight border. */
  #hud {
    width: 100%; display: flex; flex-direction: column; gap: 6px;
    padding: 8px 10px;
    background: rgba(44, 44, 48, 0.72);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-top-color: rgba(255, 255, 255, 0.18);
    border-radius: 11px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.40);
    color: #f3f3f3;
    /* collapsed (also the COLLAPSE transition: snappier) */
    opacity: 0; transform: translateY(8px) scale(0.97); transform-origin: bottom center;
    transition: opacity 130ms ease-in, transform 130ms ease-in;
    will-change: opacity, transform;
  }
  /* expand transition: a touch longer + springy ease-out */
  #hud.show { opacity: 1; transform: translateY(0) scale(1);
    transition: opacity 170ms ease-out, transform 170ms cubic-bezier(0.2, 0.85, 0.3, 1); }

  /* ── usage strip ── */
  .usage { display: flex; align-items: center; gap: 7px; font-size: 11px; line-height: 1; height: 14px; }
  .u-label { color: rgba(255, 255, 255, 0.55); font-weight: 600; }
  .u-bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .u-bar > i { display: block; height: 100%; border-radius: 2px; background: #5ed1ff; }
  .u-bar.orange > i { background: #ffb84e; }
  .u-bar.red > i { background: #ff6b6b; }
  .u-val { color: rgba(255, 255, 255, 0.92); font-variant-numeric: tabular-nums; font-weight: 600; }
  .u-reset { color: rgba(255, 255, 255, 0.45); font-variant-numeric: tabular-nums; }
  .usage.muted { color: rgba(255, 255, 255, 0.5); }

  .sep { height: 1px; background: rgba(255, 255, 255, 0.08); }

  /* ── toolbar ── */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
  .hud-btn {
    width: 34px; height: 34px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; line-height: 1;
    background: transparent; border: none; border-radius: 7px; color: #fff;
    cursor: pointer; transition: background 100ms ease;
  }
  .hud-btn:hover { background: rgba(255, 255, 255, 0.10); }
  .hud-btn:active { background: rgba(255, 255, 255, 0.16); }
</style></head>
<body>
<div id="hud">
  <div id="usage" class="usage muted">加载中…</div>
  <div class="sep"></div>
  <div id="toolbar" class="toolbar"></div>
</div>
<script src="glassbox-hud-renderer.js"></script>
</body></html>
